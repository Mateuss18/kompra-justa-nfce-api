name: Deploy to AWS Lambda

on:
  push:
    branches: [main]
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Create deployment package
        run: zip -r lambda.zip dist node_modules package.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name nfce-parser \
            --zip-file fileb://lambda.zip

  staging:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/nfce-import-diagnostics'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Compile and test candidate
        run: npm test
      - name: Package candidate
        run: zip -q -r lambda.zip dist node_modules package.json
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1
      - name: Deploy isolated staging and verify HTTP contract
        run: node scripts/staging.cjs
      - name: Save staging result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfce-staging-result
          path: staging-result.json
          if-no-files-found: ignore
